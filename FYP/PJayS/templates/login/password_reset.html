{% load static %}
{% load custom_filters %}  <!-- This line is already present -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Reset Password</h2>
        <p class="text-center">Enter your email address to receive a password reset link.</p>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="form-group">
                {{ form.email.label_tag }}
                {{ form.email|add_class:"form-control" }}  <!-- Add Bootstrap class for styling -->
            </div>
            <!-- Add other form fields and submit button here -->
            <button type="submit" class="btn btn-primary">Send Password Reset Link</button>
        </form>
    </div>
</body>
</html>
